query DrugPharmacogenomicsQuery($chemblId: String!, $index: Int! = 0, $size: Int! = 10) {
  drug(chemblId: $chemblId) {
    id
    pharmacogenomics(page: { index: $index, size: $size }) {
      count
      rows {
        variantAnnotation {
          entity
          effect
          effectType
          effectDescription
          literature
          directionality
          baseAlleleOrGenotype
          comparisonAlleleOrGenotype
        }
        variantRsId
        genotypeId
        variantFunctionalConsequence {
          id
          label
        }
        target {
          id
          approvedSymbol
        }
        haplotypeId
        haplotypeFromSourceId
        isDirectTarget
        phenotypeFromSourceId
        genotypeAnnotationText
        phenotypeText
        pgxCategory
        evidenceLevel
        studyId
        literature
      }
    }
  }
}
