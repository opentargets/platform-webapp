query DrugWarningsQuery($chemblId: String!, $index: Int! = 0, $size: Int! = 10) {
  drug(chemblId: $chemblId) {
    id
    drugWarnings(page: { index: $index, size: $size }) {
      count
      rows {
        id
        warningType
        description
        toxicityClass
        country
        year
        efoTerm
        efoId
        efoIdForWarningClass
        references {
          id
          source
          url
        }
      }
    }
  }
}
