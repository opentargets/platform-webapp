query IndicationsQuery($chemblId: String!, $index: Int! = 0, $size: Int! = 10) {
  drug(chemblId: $chemblId) {
    id
    indications(page: { index: $index, size: $size }) {
      count
      rows {
        id
        maxClinicalStage
        disease {
          id
          name
        }
        clinicalReports {
          id
        }
      }
    }
  }
}
