query IndicationsQuery(
  $chemblId: String!
  $index: Int! = 0
  $size: Int! = 10
  # most advanced first; the cards have no sort control
  $sort: [DrugIndicationSort!]! = [
    { key: MAX_CLINICAL_STAGE, direction: DESCENDING }
    { key: CLINICAL_REPORT_COUNT, direction: DESCENDING }
  ]
  $search: DrugIndicationSearch
) {
  drug(chemblId: $chemblId) {
    id
    indications(page: { index: $index, size: $size }, sort: $sort, search: $search) {
      count
      rows {
        id
        maxClinicalStage
        disease {
          id
          name
        }
        clinicalReports {
          id
        }
      }
    }
  }
}
