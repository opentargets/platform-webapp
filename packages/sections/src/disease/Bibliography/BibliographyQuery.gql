query DiseaseBibliographyQuery(
  $id: String!
  $ids: [String!] = []
  $startYear: Int = null
  $startMonth: Int = null
  $endYear: Int = null
  $endMonth: Int = null
  $threshold: Float = 0.5
  $size: Int! = 15
  $entityNames: [String!] = []
  $index: Int! = 0
  $pageSize: Int! = 5
) {
  disease(efoId: $id) {
    id
    name
    similarEntities(
      additionalIds: $ids
      threshold: $threshold
      page: { index: 0, size: $size }
      entityNames: $entityNames
    ) {
      count
      rows {
        score
        id
        object {
          ... on Target {
            id
            approvedSymbol
          }
          ... on Drug {
            id
            name
          }
          ... on Disease {
            id
            name
          }
        }
      }
    }
    literatureOcurrences(
      additionalIds: $ids
      page: { index: $index, size: $pageSize }
      startYear: $startYear
      startMonth: $startMonth
      endYear: $endYear
      endMonth: $endMonth
    ) {
      count
      stats {
        earliestPubDate
      }
      rows {
        pmid
        pmcid
        publicationDate
      }
    }
  }
}
