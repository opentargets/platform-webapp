query drugsQuery($efoId: String!, $index: Int! = 0, $size: Int! = 10) {
  disease(efoId: $efoId) {
    name
    drugAndClinicalCandidates(page: { index: $index, size: $size }) {
      count
      rows {
        id
        maxClinicalStage
        drug {
          id
          name
        }
        clinicalReports {
          id
        }
      }
    }
  }
}
