query GWASStudiesQuery(
  $diseaseIds: [String!]!
  $size: Int! = 10
  $index: Int! = 0
  $sort: [DiseaseStudiesSort!]! = []
  $search: DiseaseStudiesSearch
) {
  studies: diseases(efoIds: $diseaseIds) {
    studiesView(sort: $sort, search: $search, page: { size: $size, index: $index }) {
      count
      rows {
        id
        projectId
        traitFromSource
        publicationFirstAuthor
        publicationDate
        publicationJournal
        nSamples
        cohorts
        pubmedId
        ldPopulationStructure {
          ldPopulation
          relativeSampleSize
        }
        credibleSetsCount
      }
    }
  }
}
