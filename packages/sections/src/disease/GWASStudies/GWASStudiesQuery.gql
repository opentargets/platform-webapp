query GWASStudiesQuery(
  $diseaseIds: [String!]!
  $size: Int!
  $index: Int!
  $sort: [StudySort!]! = []
  $search: String
) {
  studies(
    diseaseIds: $diseaseIds
    page: { size: $size, index: $index }
    sort: $sort
    search: $search
  ) {
    count
    rows {
      id
      projectId
      traitFromSource
      publicationFirstAuthor
      publicationDate
      publicationJournal
      nSamples
      cohorts
      pubmedId
      ldPopulationStructure {
        ldPopulation
        relativeSampleSize
      }
      credibleSets {
        count
      }
    }
  }
}
