query QTLCredibleSetsQuery($studyId: String!, $page: Page) {
  study(studyId: $studyId) {
    id
    credibleSets(page: $page) {
      count
      rows {
        studyLocusId
        variant {
          variantId
          chromosome
          position
          referenceAllele
          alternateAllele
        }
        pValueMantissa
        pValueExponent
        beta
        locus {
          count
        }
        finemappingMethod
        confidence
      }
    }
  }
}
