query StudyQTLCredibleSetsQuery($studyId: String!, $page: Page) {
  study(studyId: $studyId) {
    id
    credibleSets(page: $page) {
      count
      rows {
        credibleSetId
        leadVariant {
          variantId
          chromosome
          position
          referenceAllele
          alternateAllele
        }
        leadPValueMantissa
        leadPValueExponent
        leadBeta
        locusSize
        fineMappingMethod
        confidence
      }
    }
  }
}
