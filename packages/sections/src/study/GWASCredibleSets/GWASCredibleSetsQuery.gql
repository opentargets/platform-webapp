query StudyGWASCredibleSetsQuery(
  $studyId: String!
  $index: Int! = 0
  $size: Int! = 10
  $sort: [StudyCredibleSetsSort!]! = []
  $search: StudyCredibleSetsSearch
) {
  study(studyId: $studyId) {
    id
    credibleSetsView(page: { index: $index, size: $size }, sort: $sort, search: $search) {
      count
      rows {
        studyLocusId
        leadVariantId
        leadReferenceAllele
        leadAlternateAllele
        pValueMantissa
        pValueExponent
        beta
        locusSize
        finemappingMethod
        confidence
        topL2GGeneId
        topL2GApprovedSymbol
        topL2GScore
      }
    }
  }
}
