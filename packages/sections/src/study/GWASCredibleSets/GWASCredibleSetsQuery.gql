query GWASCredibleSetsQuery($studyId: String!, $page: Page) {
  study(studyId: $studyId) {
    id
    credibleSets(page: $page) {
      count
      rows {
        studyLocusId
        variant {
          variantId
          chromosome
          position
          referenceAllele
          alternateAllele
        }
        pValueMantissa
        pValueExponent
        beta
        locus {
          count
        }
        finemappingMethod
        confidence
        l2GPredictions(page: { size: 1, index: 0 }) {
          rows {
            target {
              id
              approvedSymbol
            }
            score
          }
        }
      }
    }
  }
}
