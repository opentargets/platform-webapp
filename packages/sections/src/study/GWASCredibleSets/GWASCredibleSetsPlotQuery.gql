query GWASCredibleSetsPlotQuery($studyId: String!, $page: Page) {
  study(studyId: $studyId) {
    credibleSets(page: $page) {
      rows {
        credibleSetId
        leadVariant {
          variantId
          chromosome
          position
          referenceAllele
          alternateAllele
        }
        leadPValueMantissa
        leadPValueExponent
      }
    }
  }
}
