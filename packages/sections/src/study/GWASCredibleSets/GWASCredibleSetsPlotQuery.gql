query StudyGWASCredibleSetsPlotQuery($studyId: String!) {
  study(studyId: $studyId) {
    credibleSetsView(page: { index: 0, size: 10000 }) {
      rows {
        credibleSetId
        leadVariantId
        leadChromosome
        leadPosition
        pValueMantissa
        pValueExponent
      }
    }
  }
}
