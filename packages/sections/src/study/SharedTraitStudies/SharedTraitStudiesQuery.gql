query SharedTraitStudiesQuery(
  $studyId: String!
  $diseaseIds: [String!]!
  $size: Int! = 10
  $index: Int! = 0
  $sort: [DiseaseStudiesSort!]! = []
  $search: DiseaseStudiesSearch
) {
  sharedTraitStudies: diseases(efoIds: $diseaseIds) {
    studiesView(
      enableIndirect: false
      filter: { studyId: { ne: $studyId } }
      sort: $sort
      search: $search
      page: { size: $size, index: $index }
    ) {
      count
      rows {
        id
        traitFromSource
        projectId
        diseaseIds
        diseaseNames
        publicationFirstAuthor
        publicationDate
        nSamples
        cohorts
        ldPopulationStructure {
          ldPopulation
          relativeSampleSize
        }
        pubmedId
      }
    }
  }
}
