query MolecularStructureQuery($variantId: String!) {
  variant(variantId: $variantId) {
    referenceAllele
    alternateAllele
    proteinCodingCoordinates(page: { index: 0, size: 1 }) {
      count
      rows {
        uniprotAccessions
        target {
          id
          approvedSymbol
        }
        referenceAminoAcid
        alternateAminoAcid
        aminoAcidPosition
      }
    }
  }
}
