query VariantQTLCredibleSetsQuery(
  $variantId: String!
  $index: Int! = 0
  $size: Int! = 10
) {
  variant(variantId: $variantId) {
    referenceAllele
    alternateAllele
    qtlCredibleSets: credibleSets(
      filter: { studyTypes: [scsqtl, sceqtl, scpqtl, sctuqtl, sqtl, eqtl, pqtl, tuqtl] }
      page: { index: $index, size: $size }
    ) {
      count
      rows {
        studyLocusId
        pValueMantissa
        pValueExponent
        beta
        finemappingMethod
        confidence
        isTransQtl
        variant {
          variantId
          chromosome
          position
          referenceAllele
          alternateAllele
        }
        study {
          id
          studyType
          condition
        }
        locus(filter: { variantIds: [$variantId] }) {
          rows {
            posteriorProbability
          }
        }
        locusSize: locus {
          count
        }
      }
    }
  }
}
