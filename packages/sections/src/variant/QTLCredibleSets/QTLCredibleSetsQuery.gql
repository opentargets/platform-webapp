query VariantQTLCredibleSetsQuery(
  $variantId: String!
  $index: Int! = 0
  $size: Int! = 10
  $sort: [VariantCredibleSetsSort!]! = []
  $search: VariantCredibleSetsSearch
) {
  variant(variantId: $variantId) {
    referenceAllele
    alternateAllele
    qtlCredibleSets: credibleSetsView(
      studyTypes: [scsqtl, sceqtl, scpqtl, sctuqtl, sqtl, eqtl, pqtl, tuqtl]
      sort: $sort
      search: $search
      page: { index: $index, size: $size }
    ) {
      count
      rows {
        credibleSetId
        pValueMantissa
        pValueExponent
        beta
        fineMappingMethod
        confidence
        isTransQtl
        leadVariantId
        leadReferenceAllele
        leadAlternateAllele
        studyId
        studyType
        condition
        studyTargetId
        studyTargetApprovedSymbol
        biosampleId
        biosampleName
        posteriorProbability
        locusSize
      }
    }
  }
}
