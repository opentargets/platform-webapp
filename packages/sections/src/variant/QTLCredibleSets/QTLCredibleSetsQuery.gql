query QTLCredibleSetsQuery($variantId: String!, $page: Page) {
  variant(variantId: $variantId) {
    referenceAllele
    alternateAllele
    qtlCredibleSets: credibleSets(
      filter: { studyTypes: [scsqtl, sceqtl, scpqtl, sctuqtl, sqtl, eqtl, pqtl, tuqtl] }
      page: $page
    ) {
      count
      rows {
        studyLocusId
        pValueMantissa
        pValueExponent
        beta
        finemappingMethod
        confidence
        isTransQtl
        variant {
          variantId
          chromosome
          position
          referenceAllele
          alternateAllele
        }
        study {
          id
          studyType
          condition
        }
        locus(filter: { variantIds: [$variantId] }) {
          rows {
            posteriorProbability
          }
        }
        locusSize: locus {
          count
        }
      }
    }
  }
}
