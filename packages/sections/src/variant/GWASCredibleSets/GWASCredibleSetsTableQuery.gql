query GWASCredibleSetsTableQuery(
  $variantId: String!
  $index: Int! = 0
  $size: Int! = 10
  $sort: [VariantCredibleSetsSort!]! = []
) {
  variant(variantId: $variantId) {
    variantId
    referenceAllele
    alternateAllele
    gwasCredibleSets: credibleSets(filter: { studyTypes: [gwas] }, page: { size: 1, index: 0 }) {
      count
    }
  }
  variantCredibleSets(
    variantId: $variantId
    page: { index: $index, size: $size }
    sort: $sort
    studyTypes: [gwas]
  ) {
    count
    rows {
      studyLocusId
      leadVariantId
      leadChromosome
      leadPosition
      leadReferenceAllele
      leadAlternateAllele
      traitFromSource
      diseases {
        id
        name
      }
      studyId
      pValueMantissa
      pValueExponent
      beta
      posteriorProbability
      finemappingMethod
      confidence
      topL2GGeneId
      topL2GApprovedSymbol
      topL2GScore
      locusSize
    }
  }
}
