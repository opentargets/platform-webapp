query VariantGWASCredibleSetsPlotQuery($variantId: String!) {
  variant(variantId: $variantId) {
    referenceAllele
    alternateAllele
    credibleSetsView(
      studyTypes: [gwas]
      page: { index: 0, size: 10000 }
    ) {
      rows {
        studyLocusId
        pValueMantissa
        pValueExponent
        beta
        leadVariantId
        diseaseTherapeuticAreas {
          id
        }
      }
    }
  }
}
