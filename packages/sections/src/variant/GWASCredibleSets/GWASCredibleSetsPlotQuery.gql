query VariantGWASCredibleSetsPlotQuery($variantId: String!) {
  variant(variantId: $variantId) {
    referenceAllele
    alternateAllele
    gwasCredibleSets: credibleSets(
      filter: { studyTypes: [gwas] }
      page: { index: 0, size: 50000 }
    ) {
      rows {
        credibleSetId
        leadPValueMantissa
        leadPValueExponent
        leadBeta
        leadVariant {
          variantId
        }
        study {
          diseases {
            therapeuticAreas {
              id
            }
          }
        }
      }
    }
  }
}
