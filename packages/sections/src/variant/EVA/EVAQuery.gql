query EVAQuery($variantId: String!, $index: Int! = 0, $size: Int! = 10) {
  variant(variantId: $variantId) {
    variantId
    referenceAllele
    alternateAllele
    evaEvidences: evidences(datasourceIds: [eva], page: { index: $index, size: $size }) {
      count
      rows {
        alleleOrigins
        allelicRequirements
        clinicalSignificances
        cohortPhenotypes
        confidence
        disease {
          id
          name
        }
        diseaseFromSource
        studyId
        literature
      }
    }
  }
}
