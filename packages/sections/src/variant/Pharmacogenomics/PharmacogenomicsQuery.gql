query PharmacogenomicsQuery($variantId: String!, $page: Page) {
  variant(variantId: $variantId) {
    referenceAllele
    alternateAllele
    pharmacogenomics(page: $page) {
      count
      rows {
        variantAnnotation {
          entity
          effect
          effectType
          literature
          directionality
          baseAlleleOrGenotype
          comparisonAlleleOrGenotype
        }
        genotypeId
        isDirectTarget
        target {
          id
          approvedSymbol
        }
        drugs {
          drugFromSource
          drugId
        }
        phenotypeFromSourceId
        genotypeAnnotationText
        phenotypeText
        pgxCategory
        evidenceLevel
        studyId
        literature
      }
    }
  }
}
