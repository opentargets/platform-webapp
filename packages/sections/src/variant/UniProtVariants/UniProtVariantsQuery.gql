query UniProtVariantsQuery($variantId: String!, $index: Int! = 0, $size: Int! = 10) {
  variant(variantId: $variantId) {
    variantId
    referenceAllele
    alternateAllele
    uniProtEvidences: evidences(datasourceIds: [uniprot_variants], page: { index: $index, size: $size }) {
      count
      rows {
        targetFromSourceId
        confidence
        diseaseFromSource
        disease {
          id
          name
        }
        literature
      }
    }
  }
}
