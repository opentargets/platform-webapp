query EnhancerToGenePredictionsQuery($variantId: String!, $page: Page) {
  variant(variantId: $variantId) {
    referenceAllele
    alternateAllele
    enhancerToGene(page: $page) {
      count
      rows {
        chromosome
        start
        end
        target {
          id
          approvedSymbol
          approvedName
        }
        pmid
        biosample {
          biosampleId
          biosampleName
        }
        biosampleFromSourceId
        score
        resourceScore {
          name
          value
        }
        datasourceId
        distanceToTss
        studyId
        intervalType
      }
    }
  }
}
