query VariantEnhancerToGenePredictionsQuery(
  $variantId: String!
  $index: Int! = 0
  $size: Int! = 10
) {
  variant(variantId: $variantId) {
    referenceAllele
    alternateAllele
    enhancerToGene(page: { index: $index, size: $size }) {
      count
      rows {
        chromosome
        start
        end
        target {
          id
          approvedSymbol
          approvedName
        }
        pmid
        biosample {
          biosampleId
          biosampleName
        }
        biosampleFromSourceId
        score
        resourceScore {
          name
          value
        }
        datasourceId
        distanceToTss
        studyId
        intervalType
      }
    }
  }
}
