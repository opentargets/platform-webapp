query VariantsQuery(
  $credibleSetId: String!
  $index: Int! = 0
  $size: Int! = 10
  $sort: [CredibleSetVariantsSort!]! = []
  $search: CredibleSetVariantsSearch
) {
  credibleSet(credibleSetId: $credibleSetId) {
    credibleSetId
    locusView(page: { index: $index, size: $size }, sort: $sort, search: $search) {
      count
      rows {
        variantId
        referenceAllele
        alternateAllele
        mostSevereConsequenceId
        mostSevereConsequenceLabel
        logBayesFactor
        posteriorProbability
        pValueMantissa
        pValueExponent
        reportedBeta
        reportedStandardError
        r2Overall
      }
    }
  }
}
