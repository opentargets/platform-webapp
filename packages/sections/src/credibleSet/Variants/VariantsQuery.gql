query VariantsQuery($studyLocusId: String!, $page: Page) {
  credibleSet(studyLocusId: $studyLocusId) {
    locus(page: $page) {
      count
      rows {
        logBF
        posteriorProbability
        variant {
          variantId
          chromosome
          position
          referenceAllele
          alternateAllele
          mostSevereConsequence {
            id
            label
          }
        }
        pValueMantissa
        pValueExponent
        beta
        standardError
        r2Overall
      }
    }
  }
}
