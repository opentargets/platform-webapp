query VariantsQuery($credibleSetId: String!, $page: Page) {
  credibleSet(credibleSetId: $credibleSetId) {
    locus(page: $page) {
      count
      rows {
        logBayesFactor
        posteriorProbability
        variant {
          variantId
          chromosome
          position
          referenceAllele
          alternateAllele
          mostSevereConsequence {
            id
            label
          }
        }
        pValueMantissa
        pValueExponent
        reportedBeta
        reportedStandardError
        r2Overall
      }
    }
  }
}
