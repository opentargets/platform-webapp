query GWASColocQuery(
  $credibleSetId: String!
  $index: Int! = 0
  $size: Int! = 10
  $sort: [CredibleSetColocalisationsSort!]! = []
  $search: CredibleSetColocalisationsSearch
) {
  credibleSet(credibleSetId: $credibleSetId) {
    credibleSetId
    colocalisationView(
      studyTypes: [gwas]
      page: { index: $index, size: $size }
      sort: $sort
      search: $search
    ) {
      count
      rows {
        otherCredibleSetId
        studyId
        projectId
        traitFromSource
        publicationFirstAuthor
        leadVariantId
        pValueMantissa
        pValueExponent
        numberColocalisingVariants
        colocalisationMethod
        h3
        h4
        clpp
        betaRatioSignAverage
      }
    }
  }
}
