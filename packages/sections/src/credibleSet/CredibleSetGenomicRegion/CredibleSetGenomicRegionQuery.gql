query CredibleSetGenomicRegionQuery($credibleSetId: String!, $size: Int!, $index: Int!) {
  credibleSet(credibleSetId: $credibleSetId) {
    leadVariant {
      id: variantId
      chromosome
      position
      referenceAllele
      alternateAllele
    }
    credibleSetId
    locus(page: { size: $size, index: $index }) {
      count
      rows {
        logBayesFactor
        posteriorProbability
        variant {
          id: variantId
          chromosome
          position
          referenceAllele
          alternateAllele
          mostSevereConsequence {
            id
            label
          }
        }
        pValueMantissa
        pValueExponent
        reportedBeta
        reportedStandardError
        r2Overall
      }
    }
    l2GPredictions {
      count
      rows {
        score
        shapBaseValue
        features {
          shapValue
          value
          name
        }
        target {
          id
          approvedSymbol
          genomicLocation {
            chromosome
            start
            end
          }
        }
      }
    }
  }
}
