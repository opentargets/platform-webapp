query CredibleSetGenomicRegionRegionTargetsQuery($chromosome: Chromosome!, $start: Int!, $end: Int!) {
  region(chromosome: $chromosome, start: $start, end: $end) {
    targets(page: { index: 0, size: 1000 }) {
      count
      rows {
        id
        approvedSymbol
        biotype
        genomicLocation {
          chromosome
          start
          end
          strand
        }
        canonicalTranscript {
          id
          chromosome
          start
          end
          strand
        }
      }
    }
  }
}
