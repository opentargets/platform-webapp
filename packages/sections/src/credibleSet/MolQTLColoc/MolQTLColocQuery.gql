query MolQTLColocQuery(
  $credibleSetId: String!
  $index: Int! = 0
  $size: Int! = 10
  $sort: [CredibleSetColocalisationsSort!]! = []
  $search: CredibleSetColocalisationsSearch
) {
  credibleSet(credibleSetId: $credibleSetId) {
    credibleSetId
    molqtlcolocalisation: colocalisationView(
      studyTypes: [scsqtl, sceqtl, scpqtl, sctuqtl, sqtl, eqtl, pqtl, tuqtl]
      page: { index: $index, size: $size }
      sort: $sort
      search: $search
    ) {
      count
      rows {
        otherCredibleSetId
        studyId
        studyType
        isTransQtl
        targetId
        targetApprovedSymbol
        biosampleId
        biosampleName
        condition
        leadVariantId
        pValueMantissa
        pValueExponent
        numberColocalisingVariants
        colocalisationMethod
        h3
        h4
        clpp
        betaRatioSignAverage
      }
    }
  }
}
