query Locus2GeneQuery($credibleSetId: String!, $page: Page) {
  credibleSet(credibleSetId: $credibleSetId) {
    credibleSetId
    l2GPredictions(page: $page) {
      count
      rows {
        shapBaseValue
        features {
          shapValue
          value
          name
        }
        score
        target {
          id
          approvedSymbol
        }
      }
    }
  }
}
