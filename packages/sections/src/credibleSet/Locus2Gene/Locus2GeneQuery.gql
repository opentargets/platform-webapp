query Locus2GeneQuery($studyLocusId: String!, $page: Page) {
  credibleSet(studyLocusId: $studyLocusId) {
    studyLocusId
    l2GPredictions(page: $page) {
      count
      rows {
        shapBaseValue
        features {
          shapValue
          value
          name
        }
        score
        target {
          id
          approvedSymbol
        }
      }
    }
  }
}
