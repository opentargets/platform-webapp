query EnhancerToGenePredictionsQuery($studyLocusId: String!, $page: Page) {
  credibleSet(studyLocusId: $studyLocusId) {
    studyLocusId
    variant {
      variantId
      referenceAllele
      alternateAllele
      enhancerToGene(page: $page) {
        count
        rows {
          chromosome
          start
          end
          target {
            id
            approvedSymbol
            approvedName
          }
          pmid
          biosample {
            biosampleId
            biosampleName
          }
          biosampleFromSourceId
          score
          resourceScore {
            name
            value
          }
          datasourceId
          distanceToTss
          studyId
          intervalType
        }
      }
    }
  }
}
