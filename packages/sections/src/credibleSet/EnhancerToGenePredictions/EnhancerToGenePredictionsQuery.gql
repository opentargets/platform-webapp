query CredibleSetEnhancerToGenePredictionsQuery(
  $credibleSetId: String!
  $index: Int! = 0
  $size: Int! = 10
  $sort: [EnhancerToGeneSort!]! = []
  $search: EnhancerToGeneSearch
) {
  credibleSet(credibleSetId: $credibleSetId) {
    credibleSetId
    leadVariant {
      variantId
      referenceAllele
      alternateAllele
      enhancerToGene(page: { index: $index, size: $size }, sort: $sort, search: $search) {
        count
        rows {
          chromosome
          start
          end
          target {
            id
            approvedSymbol
            approvedName
          }
          pmid
          biosample {
            biosampleId
            biosampleName
          }
          biosampleFromSourceId
          score
          resourceScore {
            name
            value
          }
          datasourceId
          distanceToTss
          studyId
          intervalType
        }
      }
    }
  }
}
