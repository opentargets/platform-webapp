query TargetHomologuesQuery($ensemblId: String!) {
  target(ensemblId: $ensemblId) {
    id
    homologues {
      speciesId
      speciesName
      homologyType
      isHighConfidence
      targetGeneId
      targetGeneSymbol
      queryPercentageIdentity
      targetPercentageIdentity
    }
  }
}
