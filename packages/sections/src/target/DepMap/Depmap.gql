query TargetDepMapQuery($ensemblId: String!) {
  target(ensemblId: $ensemblId) {
    id
    depMapEssentiality(page: { index: 0, size: 10000 }) {
      count
      rows {
        tissueName
        screens{
          depmapId
          cellLineName
          diseaseFromSource
          geneEffect
          expression
        }
      }
    }
  }
}
