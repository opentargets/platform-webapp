query TargetQTLCredibleSetsQuery(
  $ensemblId: String!
  $index: Int! = 0
  $size: Int! = 10
  $sort: [TargetCredibleSetsSort!]! = []
  $search: TargetCredibleSetsSearch
) {
  target(ensemblId: $ensemblId) {
    id
    approvedSymbol
    credibleSets: credibleSetsView(
      studyTypes: [scsqtl, sceqtl, scpqtl, sctuqtl, sqtl, eqtl, pqtl, tuqtl]
      sort: $sort
      search: $search
      page: { index: $index, size: $size }
    ) {
      count
      rows {
        credibleSetId
        pValueMantissa
        pValueExponent
        beta
        fineMappingMethod
        confidence
        isTransQtl
        leadVariantId
        leadReferenceAllele
        leadAlternateAllele
        studyId
        studyType
        condition
        locusSize
      }
    }
  }
}
