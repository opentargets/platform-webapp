query TargetQTLCredibleSetsQuery($ensemblId: String!, $index: Int! = 0, $size: Int! = 10) {
  target(ensemblId: $ensemblId) {
    id
    approvedSymbol
    credibleSets(page: { index: $index, size: $size }) {
      count
      rows {
        credibleSetId
        leadPValueMantissa
        leadPValueExponent
        leadBeta
        fineMappingMethod
        confidence
        isTransQtl
        leadVariant {
          id: variantId
          chromosome
          position
          referenceAllele
          alternateAllele
        }
        study {
          id
          studyType
          condition
        }
        locusSize
      }
    }
  }
}
