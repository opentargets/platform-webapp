query TargetMousePhenotypesQuery($ensemblId: String!, $index: Int! = 0, $size: Int! = 10) {
  target(ensemblId: $ensemblId) {
    id
    mousePhenotypes(page: { index: $index, size: $size }) {
      count
      rows {
        targetInModel
        targetInModelMgiId
        modelPhenotypeId
        modelPhenotypeLabel
        modelPhenotypeClasses {
          id
          label
        }
        biologicalModels {
          id
          allelicComposition
          geneticBackground
          literature
        }
      }
    }
  }
}
