query EvidenceGWASCredibleSetsQuery($ensemblId: String!, $efoId: String!, $index: Int! = 0, $size: Int! = 10) {
  target(ensemblId: $ensemblId) {
    approvedSymbol
  }
  disease(efoId: $efoId) {
    id
    name
    gwasCredibleSets: evidences(
      ensemblIds: [$ensemblId]
      datasourceIds: [gwas_credible_sets]
      page: { index: $index, size: $size }
    ) {
      count
      rows {
        disease {
          id
          name
        }
        credibleSet {
          studyLocusId
          study {
            traitFromSource
            id
            projectId
            publicationFirstAuthor
            publicationDate
            pubmedId
            nSamples
          }
          variant {
            variantId
            chromosome
            position
            referenceAllele
            alternateAllele
          }
          pValueMantissa
          pValueExponent
          beta
          finemappingMethod
          confidence
        }
        score
      }
    }
  }
}
