query EvidenceGWASCredibleSetsQuery(
  $ensemblId: String!
  $efoId: String!
  $index: Int! = 0
  $size: Int! = 10
  $sort: [EvidenceGwasCredibleSetsSort!]! = []
  $search: EvidenceGwasCredibleSetsSearch
) {
  disease(efoId: $efoId) {
    id
    evidenceViews(ensemblIds: [$ensemblId]) {
      gwasCredibleSets(page: { index: $index, size: $size }, sort: $sort, search: $search) {
        count
        rows {
          diseaseId
          diseaseName
          credibleSetId
          leadVariantId
          leadReferenceAllele
          leadAlternateAllele
          pValueMantissa
          pValueExponent
          beta
          fineMappingMethod
          confidence
          studyId
          traitFromSource
          publicationFirstAuthor
          publicationDate
          pubmedId
          nSamples
          score
        }
      }
    }
  }
}
