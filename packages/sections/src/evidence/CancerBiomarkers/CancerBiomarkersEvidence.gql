query CancerBiomarkersQuery($ensemblId: String!, $efoId: String!, $size: Int!) {
  disease(efoId: $efoId) {
    id
    cancerBiomarkersSummary: evidences(
      ensemblIds: [$ensemblId]
      datasourceIds: ["cancer_biomarkers"]
      page: {index: 0 size: $size}
    ) {
      count
      rows {
        disease {
          id
          name
        }
        diseaseFromSource
        biomarkerName
        biomarkers {
          geneticVariation {
            geneticVariationId: id
            name
            functionalConsequenceId {
              id
              label
            }
          }
          geneExpression {
            name
            id {
              id
              label
            }
          }
        }
        drugFromSource
        drug {
          id
          name
        }
        drugResponse {
          id
          name
        }
        confidence
        literature
        urls {
          niceName
          url
        }
      }
    }
  }
}
