query CancerBiomarkersQuery($ensemblId: String!, $efoId: String!, $index: Int! = 0, $size: Int! = 10) {
  disease(efoId: $efoId) {
    id
    cancerBiomarkersSummary: evidences(
      ensemblIds: [$ensemblId]
      datasourceIds: [cancer_biomarkers]
      page: { index: $index, size: $size }
    ) {
      count
      rows {
        disease {
          id
          name
        }
        diseaseFromSource
        biomarkerName
        biomarkers {
          geneticVariation {
            geneticVariationId: id
            name
            functionalConsequenceId: functionalConsequence {
              id
              label
            }
          }
          geneExpression {
            name
            id {
              id
              label
            }
          }
        }
        drugFromSource
        drug {
          id
          name
        }
        drugResponse {
          id
          name
        }
        confidence
        literature
        urls {
          niceName
          url
        }
      }
    }
  }
}
