query CancerBiomarkersQuery(
  $ensemblId: String!
  $efoId: String!
  $index: Int! = 0
  $size: Int! = 10
  $search: EvidenceCancerBiomarkersSearch
) {
  disease(efoId: $efoId) {
    id
    evidenceViews(ensemblIds: [$ensemblId]) {
      cancerBiomarkers(page: { index: $index, size: $size }, search: $search) {
        count
        rows {
          diseaseId
          diseaseName
          diseaseFromSource
          biomarkerName
          biomarkerGeneticVariations {
            id
            name
            functionalConsequenceId
            functionalConsequenceLabel
          }
          biomarkerGeneExpressions {
            id
            name
            label
          }
          drugId
          drugName
          drugFromSource
          drugResponseId
          drugResponseName
          confidence
          literature
          urls {
            niceName
            url
          }
        }
      }
    }
  }
}
