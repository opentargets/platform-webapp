query EuropePMCQuery($ensemblId: String!, $efoId: String!, $index: Int! = 0, $size: Int! = 10) {
  disease(efoId: $efoId) {
    id
    evidenceViews(ensemblIds: [$ensemblId]) {
      europePmc(page: { index: $index, size: $size }) {
        count
        rows {
          diseaseId
          diseaseName
          literature
          pmcIds
          publicationYear
          textMiningSentences {
            tStart
            tEnd
            dStart
            dEnd
            section
            text
          }
          resourceScore
        }
      }
    }
  }
}
