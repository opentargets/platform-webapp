query EuropePMCQuery(
  $ensemblId: String!
  $efoId: String!
  $index: Int! = 0
  $size: Int!
) {
  disease(efoId: $efoId) {
    id
    europePmc: evidences(
      ensemblIds: [$ensemblId]
      page: { index: $index, size: $size }
      datasourceIds: [europepmc]
    ) {
      count
      rows {
        disease {
          name
          id
        }
        target {
          approvedSymbol
          id
        }
        literature
        textMiningSentences {
          tStart
          tEnd
          dStart
          dEnd
          section
          text
        }
        resourceScore
      }
    }
  }
}
