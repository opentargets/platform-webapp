query CancerGeneCensusQuery(
  $ensemblId: String!
  $efoId: String!
  $index: Int! = 0
  $size: Int! = 10
  $sort: [EvidenceCancerGeneCensusSort!]! = []
  $search: EvidenceCancerGeneCensusSearch
) {
  disease(efoId: $efoId) {
    id
    evidenceViews(ensemblIds: [$ensemblId]) {
      cancerGeneCensus(page: { index: $index, size: $size }, sort: $sort, search: $search) {
        count
        rows {
          diseaseId
          diseaseName
          mutatedSamples {
            functionalConsequenceId
            functionalConsequenceLabel
            numberSamplesWithMutationType
            numberSamplesTested
          }
          literature
        }
      }
    }
  }
  target(ensemblId: $ensemblId) {
    id
    hallmarks {
      attributes {
        description
        pmid
        name
      }
    }
  }
}
