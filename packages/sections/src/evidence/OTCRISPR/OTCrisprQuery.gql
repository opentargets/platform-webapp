query CrisprQuery($ensemblId: String!, $efoId: String!, $size: Int!) {
  disease(efoId: $efoId) {
    id
    OtCrisprSummary: evidences(
      ensemblIds: [$ensemblId]
      datasourceIds: [ot_crispr]
      size: { index: 0 size: $size }
    ) {
      count
      rows {
        disease {
          id
          name
        }
        projectId
        contrast
        studyOverview
        cellType
        cellLineBackground
        crisprScreenLibrary
        statisticalTestTail
        resourceScore
        log2FoldChangeValue
        diseaseCellLines {
          name
        }
        releaseVersion
      }
    }
  }
}
