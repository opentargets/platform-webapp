query IntOgenQuery($ensemblId: String!, $efoId: String!, $size: Int!) {
  disease(efoId: $efoId) {
    id
    intOgen: evidences(
      ensemblIds: [$ensemblId]
      datasourceIds: [intogen]
      page: { index: 0 size: $size }
    ) {
      count
      rows {
        disease {
          id
          name
        }
        diseaseFromSource
        target {
          approvedSymbol
        }
        mutatedSamples {
          functionalConsequence {
            id
            label
          }
          numberSamplesTested
          numberMutatedSamples
        }
        resourceScore
        significantDriverMethods
        cohortId
        cohortShortName
        cohortDescription
      }
    }
  }
  target(ensemblId: $ensemblId) {
    id
    hallmarks {
      attributes {
        description
        pmid
        name
      }
    }
  }
}
