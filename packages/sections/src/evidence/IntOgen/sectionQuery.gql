query IntOgenQuery(
  $ensemblId: String!
  $efoId: String!
  $index: Int! = 0
  $size: Int! = 10
  $sort: [EvidenceIntogenSort!]! = []
  $search: EvidenceIntogenSearch
) {
  disease(efoId: $efoId) {
    id
    evidenceViews(ensemblIds: [$ensemblId]) {
      intogen(page: { index: $index, size: $size }, sort: $sort, search: $search) {
        count
        rows {
          diseaseId
          diseaseName
          diseaseFromSource
          targetApprovedSymbol
          mutatedSamples {
            numberSamplesTested
            numberMutatedSamples
          }
          resourceScore
          significantDriverMethods
          cohortId
          cohortShortName
          cohortDescription
        }
      }
    }
  }
  target(ensemblId: $ensemblId) {
    id
    hallmarks {
      attributes {
        description
        pmid
        name
      }
    }
  }
}
