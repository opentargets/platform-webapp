query GeneBurdenQuery($ensemblId: String!, $efoId: String!, $size: Int!) {
  disease(efoId: $efoId) {
    id
    geneBurdenSummary: evidences(
      ensemblIds: [$ensemblId]
      datasourceIds: [gene_burden]
      page: { index: 0 size: $size }
    ) {
      count
      rows {
        disease {
          id
          name
        }
        diseaseFromSource
        target {
          id
          approvedSymbol
        }
        releaseVersion
        targetFromSourceId
        urls {
          url
        }
        directionOnTarget
        directionOnTrait
        allelicRequirements
        studyId
        ancestry
        ancestryId
        resourceScore
        cohortId
        projectId
        statisticalMethod
        statisticalMethodOverview
        studyCases
        studyCasesWithQualifyingVariants
        studySampleSize
        oddsRatio
        oddsRatioConfidenceIntervalLower
        oddsRatioConfidenceIntervalUpper
        beta
        betaConfidenceIntervalLower
        betaConfidenceIntervalUpper
        pValueMantissa
        pValueExponent
        literature
      }
    }
  }
}
