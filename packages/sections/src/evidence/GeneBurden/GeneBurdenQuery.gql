query GeneBurdenQuery(
  $ensemblId: String!
  $efoId: String!
  $index: Int! = 0
  $size: Int! = 10
  $sort: [EvidenceGeneBurdenSort!]! = []
  $search: EvidenceGeneBurdenSearch
) {
  disease(efoId: $efoId) {
    id
    evidenceViews(ensemblIds: [$ensemblId]) {
      geneBurden(page: { index: $index, size: $size }, sort: $sort, search: $search) {
        count
        rows {
          diseaseId
          diseaseName
          diseaseFromSource
          targetId
          targetFromSourceId
          urls
          directionOnTarget
          directionOnTrait
          allelicRequirements
          ancestry
          ancestryId
          cohortId
          projectId
          statisticalMethod
          statisticalMethodOverview
          studyCases
          studyCasesWithQualifyingVariants
          studySampleSize
          oddsRatio
          oddsRatioConfidenceIntervalLower
          oddsRatioConfidenceIntervalUpper
          beta
          betaConfidenceIntervalLower
          betaConfidenceIntervalUpper
          pValueMantissa
          pValueExponent
          literature
        }
      }
    }
  }
}
