query CrisprQuery($ensemblId: String!, $efoId: String!, $size: Int!) {
  disease(efoId: $efoId) {
    id
    crisprSummary: evidences(
      ensemblIds: [$ensemblId]
      datasourceIds: [crispr]
      page: { index: 0 size: $size }
    ) {
      count
      rows {
        disease {
          id
          name
        }
        diseaseCellLines {
          name
          id
        }
        diseaseFromSource
        resourceScore
        literature
      }
    }
  }
}
