query ClinvarQuery(
  $ensemblId: String!
  $efoId: String!
  $index: Int! = 0
  $size: Int! = 10
  $sort: [EvidenceEvaSort!]! = []
) {
  disease(efoId: $efoId) {
    id
    evidenceViews(ensemblIds: [$ensemblId]) {
      eva(page: { index: $index, size: $size }, sort: $sort) {
        count
        rows {
          score
          diseaseId
          diseaseName
          diseaseFromSource
          cohortPhenotypes
          variantId
          variantHgvsId
          variantChromosome
          variantPosition
          variantReferenceAllele
          variantAlternateAllele
          variantRsId
          variantFunctionalConsequenceId
          variantFunctionalConsequenceLabel
          directionOnTarget
          directionOnTrait
          studyId
          clinicalSignificances
          allelicRequirements
          alleleOrigins
          confidence
          literature
        }
      }
    }
  }
}
