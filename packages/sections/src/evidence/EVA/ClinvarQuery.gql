query ClinvarQuery($ensemblId: String!, $efoId: String!, $size: Int!) {
  target(ensemblId: $ensemblId) {
    approvedSymbol
  }
  disease(efoId: $efoId) {
    id
    name
    eva: evidences(
      ensemblIds: [$ensemblId]
      datasourceIds: [eva]
      page: { index: 0 size: $size }
    ) {
      count
      rows {
        disease {
          id
          name
        }
        variant {
          id
          hgvsId
          chromosome
          position
          referenceAllele
          alternateAllele
        }
        directionOnTarget
        directionOnTrait
        diseaseFromSource
        variantRsId
        studyId
        variantFunctionalConsequence {
          id
          label
        }
        clinicalSignificances
        allelicRequirements
        alleleOrigins
        confidence
        literature
        cohortPhenotypes
      }
    }
  }
}
