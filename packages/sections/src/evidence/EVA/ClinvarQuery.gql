query ClinvarQuery($ensemblId: String!, $efoId: String!, $index: Int! = 0, $size: Int! = 10) {
  target(ensemblId: $ensemblId) {
    approvedSymbol
  }
  disease(efoId: $efoId) {
    id
    name
    eva: evidences(
      ensemblIds: [$ensemblId]
      datasourceIds: [eva]
      page: { index: $index, size: $size }
    ) {
      count
      rows {
        disease {
          id
          name
        }
        directionOnTarget
        directionOnTrait
        diseaseFromSource
        variantRsId
        studyId
        variantFunctionalConsequence {
          id
          label
        }
        clinicalSignificances
        allelicRequirements
        alleleOrigins
        confidence
        literature
        cohortPhenotypes
      }
    }
  }
}
