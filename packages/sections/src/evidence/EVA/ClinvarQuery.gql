query ClinvarQuery($ensemblId: String!, $efoId: String!, $index: Int! = 0, $size: Int! = 10) {
  disease(efoId: $efoId) {
    id
    evidenceViews(ensemblIds: [$ensemblId]) {
      eva(page: { index: $index, size: $size }) {
        count
        rows {
          diseaseId
          diseaseName
          diseaseFromSource
          cohortPhenotypes
          variantId
          variantHgvsId
          variantChromosome
          variantPosition
          variantReferenceAllele
          variantAlternateAllele
          variantRsId
          variantFunctionalConsequenceId
          variantFunctionalConsequenceLabel
          directionOnTarget
          directionOnTrait
          studyId
          clinicalSignificances
          allelicRequirements
          alleleOrigins
          confidence
          literature
        }
      }
    }
  }
}
