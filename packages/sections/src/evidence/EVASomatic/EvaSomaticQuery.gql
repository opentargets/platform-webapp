query EvaSomaticQuery($ensemblId: String!, $efoId: String!, $size: Int!, $cursor: String) {
  disease(efoId: $efoId) {
    id
    eva_somatic: evidences(
      ensemblIds: [$ensemblId]
      datasourceIds: [eva_somatic]
      page: { index: 0 size: $size }
    ) {
      count
      rows {
        disease {
          id
          name
        }
        variant {
          hgvsId
        }
        directionOnTarget
        directionOnTrait
        diseaseFromSource
        variant {
          id
          hgvsId
          referenceAllele
          alternateAllele
        }
        variantRsId
        studyId
        clinicalSignificances
        allelicRequirements
        alleleOrigins
        confidence
        literature
        cohortPhenotypes
      }
    }
  }
  target(ensemblId: $ensemblId) {
    id
    hallmarks {
      attributes {
        description
        pmid
        name
      }
    }
  }
}
