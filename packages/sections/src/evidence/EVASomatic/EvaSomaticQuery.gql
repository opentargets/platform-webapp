query EvaSomaticQuery($ensemblId: String!, $efoId: String!, $index: Int! = 0, $size: Int! = 10) {
  disease(efoId: $efoId) {
    id
    evidenceViews(ensemblIds: [$ensemblId]) {
      evaSomatic(page: { index: $index, size: $size }) {
        count
        rows {
          diseaseId
          diseaseName
          diseaseFromSource
          cohortPhenotypes
          variantId
          variantHgvsId
          variantReferenceAllele
          variantAlternateAllele
          variantRsId
          directionOnTarget
          directionOnTrait
          studyId
          clinicalSignificances
          allelicRequirements
          alleleOrigins
          confidence
          literature
        }
      }
    }
  }
  target(ensemblId: $ensemblId) {
    id
    hallmarks {
      attributes {
        description
        pmid
        name
      }
    }
  }
}
