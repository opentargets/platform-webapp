query EvaSomaticQuery($ensemblId: String!, $efoId: String!, $index: Int! = 0, $size: Int! = 10) {
  disease(efoId: $efoId) {
    id
    eva_somatic: evidences(
      ensemblIds: [$ensemblId]
      datasourceIds: [eva_somatic]
      page: { index: $index, size: $size }
    ) {
      count
      rows {
        disease {
          id
          name
        }
        directionOnTarget
        directionOnTrait
        diseaseFromSource
        variantRsId
        studyId
        clinicalSignificances
        allelicRequirements
        alleleOrigins
        confidence
        literature
        cohortPhenotypes
      }
    }
  }
  target(ensemblId: $ensemblId) {
    id
    hallmarks {
      attributes {
        description
        pmid
        name
      }
    }
  }
}
