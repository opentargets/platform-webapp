query ClinicalPrecedence(
  $ensemblId: String!
  $efoId: String!
  $index: Int! = 0
  $size: Int! = 10
  $sort: [EvidenceClinicalPrecedenceSort!]! = []
  $search: EvidenceClinicalPrecedenceSearch
) {
  disease(efoId: $efoId) {
    id
    evidenceViews(ensemblIds: [$ensemblId]) {
      clinicalPrecedence(page: { index: $index, size: $size }, sort: $sort, search: $search) {
        count
        rows {
          diseaseId
          diseaseName
          targetId
          targetApprovedSymbol
          drugId
          drugName
          drugTargetIds
          directionOnTarget
          directionOnTrait
          clinicalStage
          clinicalReportId
          studyStartDate
        }
      }
    }
  }
}
