query OpenTargetsGeneticsQuery(
  $ensemblId: String!
  $efoId: String!
  $size: Int!
) {
  disease(efoId: $efoId) {
    id
    gene2Phenotype: evidences(
      ensemblIds: [$ensemblId]
      datasourceIds: [gene2phenotype]
      page: { index: 0 size: $size }
    ) {
      count
      rows {
        id
        disease {
          id
          name
        }
        diseaseFromSource
        allelicRequirements
        confidence
        studyId
        targetFromSourceId
        target {
          approvedSymbol
        }
        variantFunctionalConsequence {
          id
          label
        }
        literature
        directionOnTarget
        directionOnTrait
      }
    }
  }
}
