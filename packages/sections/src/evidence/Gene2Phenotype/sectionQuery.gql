query OpenTargetsGeneticsQuery(
  $ensemblId: String!
  $efoId: String!
  $index: Int! = 0
  $size: Int! = 10
  $search: EvidenceGene2PhenotypeSearch
) {
  disease(efoId: $efoId) {
    id
    evidenceViews(ensemblIds: [$ensemblId]) {
      gene2Phenotype(page: { index: $index, size: $size }, search: $search) {
        count
        rows {
          diseaseId
          diseaseName
          diseaseFromSource
          allelicRequirements
          confidence
          studyId
          targetFromSourceId
          variantFunctionalConsequenceId
          variantFunctionalConsequenceLabel
          literature
          directionOnTarget
          directionOnTrait
        }
      }
    }
  }
}
