query ClingenQuery($ensemblId: String!, $efoId: String!, $size: Int!) {
  disease(efoId: $efoId) {
    id
    clingenSummary: evidences(
      ensemblIds: [$ensemblId]
      datasourceIds: [clingen]
      page: { index: 0 size: $size }
    ) {
      count
      rows {
        disease {
          id
          name
        }
        diseaseFromSource
        allelicRequirements
        studyId
        confidence
        urls {
          url
        }
      }
    }
  }
}
