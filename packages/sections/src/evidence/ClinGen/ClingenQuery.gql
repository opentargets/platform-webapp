query ClingenQuery($ensemblId: String!, $efoId: String!, $index: Int! = 0, $size: Int! = 10) {
  disease(efoId: $efoId) {
    id
    clingenSummary: evidences(
      ensemblIds: [$ensemblId]
      datasourceIds: [clingen]
      page: { index: $index, size: $size }
    ) {
      count
      rows {
        disease {
          id
          name
        }
        diseaseFromSource
        allelicRequirements
        studyId
        confidence
        urls {
          url
        }
      }
    }
  }
}
