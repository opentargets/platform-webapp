query UniprotLiteratureQuery(
  $ensemblId: String!
  $efoId: String!
  $index: Int! = 0
  $size: Int! = 10
  $search: EvidenceUniprotLiteratureSearch
) {
  disease(efoId: $efoId) {
    id
    evidenceViews(ensemblIds: [$ensemblId]) {
      uniprotLiterature(page: { index: $index, size: $size }, search: $search) {
        count
        rows {
          diseaseId
          diseaseName
          diseaseFromSource
          targetFromSourceId
          literature
          confidence
        }
      }
    }
  }
}
