query ExpressionAtlasQuery($ensemblId: String!, $efoId: String!, $size: Int!) {
  disease(efoId: $efoId) {
    id
    expressionAtlasSummary: evidences(
      ensemblIds: [$ensemblId]
      datasourceIds: [expression_atlas]
      page: { index: 0 size: $size }
    ) {
      count
      rows {
        disease {
          id
          name
        }
        diseaseFromSource
        contrast
        confidence
        studyOverview
        log2FoldChangeValue
        resourceScore
        log2FoldChangePercentileRank
        studyId
      }
    }
  }
}
