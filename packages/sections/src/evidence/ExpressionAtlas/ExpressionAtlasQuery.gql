query ExpressionAtlasQuery(
  $ensemblId: String!
  $efoId: String!
  $index: Int! = 0
  $size: Int! = 10
  $sort: [EvidenceExpressionAtlasSort!]! = []
  $search: EvidenceExpressionAtlasSearch
) {
  disease(efoId: $efoId) {
    id
    evidenceViews(ensemblIds: [$ensemblId]) {
      expressionAtlas(page: { index: $index, size: $size }, sort: $sort, search: $search) {
        count
        rows {
          diseaseId
          diseaseName
          diseaseFromSource
          contrast
          confidence
          studyOverview
          log2FoldChangeValue
          resourceScore
          log2FoldChangePercentileRank
          studyId
        }
      }
    }
  }
}
