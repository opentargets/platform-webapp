query CrisprScreenQuery($ensemblId: String!, $efoId: String!, $index: Int! = 0, $size: Int! = 10) {
  disease(efoId: $efoId) {
    id
    CrisprScreenSummary: evidences(
      ensemblIds: [$ensemblId]
      datasourceIds: [crispr_screen]
      page: { index: $index, size: $size }
    ) {
      count
      rows {
        studyId
        datatypeId
        datasourceId
        projectId
        crisprScreenLibrary
        studyOverview
        cellType
        literature
        diseaseFromSource
        diseaseFromSourceMappedId
        contrast
        targetFromSourceId
        resourceScore
        statisticalTestTail
        log2FoldChangeValue
      }
    }
  }
}
