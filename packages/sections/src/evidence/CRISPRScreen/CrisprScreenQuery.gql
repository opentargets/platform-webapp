query CrisprScreenQuery(
  $ensemblId: String!
  $efoId: String!
  $index: Int! = 0
  $size: Int! = 10
  $sort: [EvidenceCrisprScreenSort!]! = []
  $search: EvidenceCrisprScreenSearch
) {
  disease(efoId: $efoId) {
    id
    evidenceViews(ensemblIds: [$ensemblId]) {
      crisprScreen(page: { index: $index, size: $size }, sort: $sort, search: $search) {
        count
        rows {
          studyId
          projectId
          crisprScreenLibrary
          studyOverview
          cellType
          literature
          diseaseFromSource
          diseaseFromSourceMappedId
          contrast
          resourceScore
          statisticalTestTail
          phenotypicConsequenceScore
        }
      }
    }
  }
}
