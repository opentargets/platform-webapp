query CrisprScreenQuery($ensemblId: String!, $efoId: String!, $size: Int!) {
  disease(efoId: $efoId) {
    id
    CrisprScreenSummary: evidences(
      ensemblIds: [$ensemblId]
      datasourceIds: [crispr_screen]
      page: { index: 0 size: $size }
    ) {
      count
      rows {
        studyId
        datatypeId
        datasourceId
        projectId
        crisprScreenLibrary
        studyOverview
        cellType
        literature
        diseaseFromSource
        diseaseFromSourceMappedId
        contrast
        targetFromSourceId
        resourceScore
        statisticalTestTail
        log2FoldChangeValue
      }
    }
  }
}
