query Locus2GeneQuery($credibleSetId: String!) {
  credibleSet(credibleSetId: $credibleSetId) {
    credibleSetId
    l2GPredictions {
      count
      rows {
        shapBaseValue
        features {
          shapValue
          value
          name
        }
        score
        target {
          id
          approvedSymbol
        }
      }
    }
  }
}
