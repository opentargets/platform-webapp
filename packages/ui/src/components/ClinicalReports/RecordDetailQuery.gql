query RecordDetailQuery($clinicalReportId: String!) {
  clinicalReport(clinicalReportId: $clinicalReportId) {
    clinicalStage
    countries
    diseases {
      diseaseFromSource
      disease {
        id
        name
      }
    }
    drugs {
      drugFromSource
    }
    id
    phaseFromSource
    sideEffects {
      diseaseFromSource
      disease {
        name
      }
    }
    source
    trialDescription
    trialLiterature {
      id
      type: referenceType
    }
    title
    trialOverallStatus
    trialPrimaryPurpose
    trialSponsor {
      agencyClass
      name
    }
    trialStartDate
    trialWhyStopped
    trialStopReasonCategories
    type: evidenceType
    trialStudyType
    url
    year
  }
}
