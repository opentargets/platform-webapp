query SearchQuery($queryString: String!, $size: Int!) {
  topHit: search(
    queryString: $queryString
    entityNames: [target, disease, drug, variant, study]
    page: { index: 0, size: 1 }
  ) {
    hits {
      id
      entity
      name
      description
      keywords
      object {
        ... on Target {
          id
          approvedSymbol
          approvedName
          functionDescriptions
        }

        ... on Disease {
          id
          name
          description
        }

        ... on Variant {
          id: variantId
          variantDescription
          referenceAllele
          alternateAllele
          rsIds
        }

        ... on Drug {
          id
          name
          description
        }

        ... on Study {
          # entity
          id
          hasSumstats
          traitFromSource
          nSamples
          publicationDate
          publicationFirstAuthor
          publicationJournal
          studyType
          credibleSets {
            credibleSetsCount: count
          }
        }
      }
    }
  }

  targets: search(
    queryString: $queryString
    entityNames: [target]
    page: { index: 0, size: $size }
  ) {
    hits {
      id
      entity
      name
      description
      keywords
      object {
        ... on Target {
          id
          approvedSymbol
          approvedName
        }
      }
    }
  }

  diseases: search(
    queryString: $queryString
    entityNames: [disease]
    page: { index: 0, size: $size }
  ) {
    hits {
      id
      entity
      name
      description
      keywords
      object {
        ... on Disease {
          id
          name
        }
      }
    }
  }

  variants: search(
    queryString: $queryString
    entityNames: [variant]
    page: { index: 0, size: $size }
  ) {
    hits {
      id
      entity
      name
      description
      keywords
      object {
        ... on Variant {
          id: variantId
          variantDescription
          referenceAllele
          alternateAllele
          rsIds
        }
      }
    }
  }

  studies: search(
    queryString: $queryString
    entityNames: [study]
    page: { index: 0, size: $size }
  ) {
    hits {
      id
      entity
      name
      description
      keywords
      object {
        ... on Study {
          id
          hasSumstats
          traitFromSource
          nSamples
          studyType
          credibleSets {
            credibleSetsCount: count
          }
        }
      }
    }
  }

  drugs: search(queryString: $queryString, entityNames: [drug], page: { index: 0, size: $size }) {
    hits {
      id
      entity
      name
      description
      keywords
      object {
        ... on Drug {
          id
          name
        }
      }
    }
  }
}
