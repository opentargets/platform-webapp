# Only what the row interactors table reads: the partner ids (to filter the associations
# query) and their scores. The new API rejects a 3000-row page that also selects the
# evidences with "Query is too complex.".
query InteractionsSectionQuery(
  $ensgId: String!
  $sourceDatabase: InteractionSourceDatabase
  $index: Int = 0
  $size: Int = 10
  $scoreThreshold: Float
) {
  target(ensemblId: $ensgId) {
    id
    interactions(
      sourceDatabase: $sourceDatabase
      scoreThreshold: $scoreThreshold
      page: { index: $index, size: $size }
    ) {
      count
      rows {
        targetB {
          id
        }
        score
      }
    }
  }
}
