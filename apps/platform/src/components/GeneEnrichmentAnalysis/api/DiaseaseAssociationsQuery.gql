query GeneEnrichmentAnalysisDiseaseAssociationsQuery(
  $efoId: String!
  $index: Int!
  $size: Int!
  $sort: AssociationSort!
  $datasourcePolicyOverrides: [DatasourcePolicyOverride!]!
  $rowsFilter: [String!]!
  $facetFilters: [String!]!
  $entitySearch: String
) {
  disease(efoId: $efoId) {
    id
    name
    associatedTargets(
      page: { index: $index, size: $size }
      sort: $sort
      datasourcePolicyOverrides: $datasourcePolicyOverrides
      Bs: $rowsFilter
      facetFilters: $facetFilters
      BFilter: $entitySearch
    ) {
      count
      rows {
        target {
          id
          approvedSymbol
          approvedName
          prioritisation {
            items {
              key
              value
            }
          }
        }
        score
        datasourceScores {
          componentId: id
          score
        }
      }
    }
  }
}
