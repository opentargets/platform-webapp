fragment CredibleSetProfileHeaderFragment on CredibleSet {
  leadPValueMantissa
  leadPValueExponent
  leadBeta
  leadStandardError
  leadEffectAlleleFrequency
  qualityControls
  locus(filter: { variantIds: $variantIds }) {
    count
    rows {
      posteriorProbability
      pValueMantissa
      pValueExponent
      reportedBeta
      reportedStandardError
    }
  }
  leadVariant {
    variantId
    chromosome
    position
    rsIds
  }
  fineMappingMethod
  purityMinR2
  locusStart
  locusEnd
  confidence
  study {
    id
    projectId
    publicationFirstAuthor
    publicationDate
    traitFromSource
    diseases {
      id
      name
    }
    publicationJournal
    pubmedId
    nSamples
    cohorts
    initialSampleSize
    studyType
    hasSumstats
    analysisFlags
    SumstatQCValues {
      QCCheckName
      QCCheckValue
    }
    ldPopulationStructure {
      ldPopulation
      relativeSampleSize
    }
  }
}
