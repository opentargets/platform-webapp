fragment CredibleSetProfileHeaderFragment on CredibleSet {
  pValueMantissa
  pValueExponent
  beta
  standardError
  effectAlleleFrequencyFromSource
  qualityControls
  locus(filter: { variantIds: $variantIds }) {
    count
    rows {
      posteriorProbability
      pValueMantissa
      pValueExponent
      beta
      standardError
    }
  }
  locusSize: locus(page: { size: 1, index: 0 }) {
    count
  }
  variant {
    variantId
    chromosome
    position
    rsIds
  }
  finemappingMethod
  purityMinR2
  locusStart
  locusEnd
  confidence
  study {
    id
    projectId
    publicationFirstAuthor
    publicationDate
    traitFromSource
    diseases {
      id
      name
    }
    publicationJournal
    pubmedId
    nSamples
    cohorts
    initialSampleSize
    studyType
    hasSumstats
    analysisFlags
    SumstatQCValues {
      QCCheckName
      QCCheckValue
    }
    ldPopulationStructure {
      ldPopulation
      relativeSampleSize
    }
  }
}
