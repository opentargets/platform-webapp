query TargetAssociationsQuery(
  $id: String!
  $index: Int!
  $size: Int!
  $sortBy: String!
  $datasourcePolicyOverrides: [DatasourcePolicyOverride!]!
  $rowsFilter: [String!]
  $facetFilters: [String!]
  $entitySearch: String!
  $includeMeasurements: Boolean
) {
  target(ensemblId: $id) {
    id
    approvedSymbol
    associatedDiseases(
      page: { index: $index, size: $size }
      sort: { key: $sortBy, direction: DESCENDING }
      datasourcePolicyOverrides: $datasourcePolicyOverrides
      Bs: $rowsFilter
      facetFilters: $facetFilters
      BFilter: $entitySearch
      includeMeasurements: $includeMeasurements
    ) {
      count
      rows {
        novelty
        disease {
          id
          name
        }
        score
        datasourceScores {
          componentId: id
          score
        }
      }
    }
  }
}
