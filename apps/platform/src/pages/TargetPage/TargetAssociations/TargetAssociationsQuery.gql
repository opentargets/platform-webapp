# TODO(ng-api): rows no longer select novelty nor the nested associationTimeSeries used by the
# novelty sparkline. Row novelty is gone from the API and any associationTimeSeries request
# drops the connection, which would take the whole table down.
# docs/new-api-migration/PAIN_POINTS.md #10, #12.
query TargetAssociationsQuery(
  $id: String!
  $index: Int!
  $size: Int!
  $sort: AssociationSort!
  $datasourcePolicyOverrides: [DatasourcePolicyOverride!]!
  $rowsFilter: [String!]!
  $facetFilters: [String!]!
  $entitySearch: String
  $includeMeasurements: Boolean!
) {
  target(ensemblId: $id) {
    id
    approvedSymbol
    associatedDiseases(
      page: { index: $index, size: $size }
      sort: $sort
      datasourcePolicyOverrides: $datasourcePolicyOverrides
      Bs: $rowsFilter
      facetFilters: $facetFilters
      BFilter: $entitySearch
      includeMeasurements: $includeMeasurements
    ) {
      count
      rows {
        disease {
          id
          name
        }
        score
        datasourceScores {
          componentId: id
          score
        }
      }
    }
  }
}
