query SearchPageQuery($queryString: String!, $index: Int!, $entityNames: [String!]!) {
  search(queryString: $queryString, entityNames: $entityNames, page: { index: $index, size: 10 }) {
    total
    aggregations {
      entities {
        name
        total
      }
    }
    hits {
      id
      entity
      name
      description
      keywords
      highlights
      object {
        ... on Study {
          id
          hasSumstats
          traitFromSource
          nSamples
          publicationDate
          publicationFirstAuthor
          publicationJournal
          studyType
          credibleSets {
            credibleSetsCount: count
          }
        }

        ... on Disease {
          id
          name
          description
        }
      }
    }
  }

  topHit: search(
    queryString: $queryString
    entityNames: $entityNames
    page: { index: 0, size: 1 }
  ) {
    hits {
      id
      entity
      name
      description
      keywords
      object {
        ... on Study {
          id
          hasSumstats
          traitFromSource
          credibleSets {
            count
          }
        }
        ... on Disease {
          id
          name
          description
          therapeuticAreas
        }
      }
    }
  }
}
