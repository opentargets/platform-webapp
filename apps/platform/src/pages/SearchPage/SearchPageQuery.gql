query SearchPageQuery($queryString: String!, $index: Int!, $entityNames: [EntityType!]!) {
  search(queryString: $queryString, entityNames: $entityNames, page: { index: $index, size: 10 }) {
    total
    aggregations {
      entities {
        name
        total
      }
    }
    hits {
      id
      entity
      name
      description
      keywords
      highlights
      object {
        ... on Target {
          id
          approvedSymbol
          functionDescriptions
        }

        ... on Variant {
          id: variantId
          variantDescription
          referenceAllele
          alternateAllele
          rsIds
        }

        ... on Study {
          id
          hasSumstats
          traitFromSource
          nSamples
          publicationDate
          publicationFirstAuthor
          publicationJournal
          studyType
          credibleSets {
            credibleSetsCount: count
          }
          biosample {
            biosampleId
            biosampleName
          }
          target {
            id
            approvedSymbol
          }
        }

        ... on Disease {
          id
          name
          description
        }

        ... on Drug {
          id
          name
          description
        }
      }
    }
  }

  topHit: search(
    queryString: $queryString
    entityNames: $entityNames
    page: { index: 0, size: 1 }
  ) {
    hits {
      id
      entity
      name
      description
      keywords
      object {
        ... on Target {
          id
          approvedSymbol
          approvedName
          functionDescriptions
          biotype
          proteinIds {
            id
            source
          }
        }
        ... on Variant {
          id: variantId
          variantDescription
          chromosome
          position
          referenceAllele
          alternateAllele
          rsIds
          mostSevereConsequence {
            id
            label
          }
        }
        ... on Study {
          id
          hasSumstats
          traitFromSource
          credibleSets {
            count
          }
        }
        ... on Disease {
          id
          name
          description
          therapeuticAreas {
            id
            name
          }
        }
        ... on Drug {
          id
          name
          description
          drugType
          maximumClinicalStage
          synonyms {
            label
            source
          }
          tradeNames {
            label
            source
          }
          indications {
            rows {
              id
              disease {
                id
                name
              }
            }
          }
        }
      }
    }
  }
}
