query QTLCredibleSetsQuery {
  variant(variantId: "19_44908822_C_T") {
    variantId
    qtlCredibleSets: credibleSets(
      filter: { studyTypes: [scsqtl, sceqtl, scpqtl, sctuqtl, sqtl, eqtl, pqtl, tuqtl] }
    ) {
      count
      rows {
        studyLocusId
        pValueMantissa
        pValueExponent
        beta
        finemappingMethod
        confidence
        variant {
          variantId
          chromosome
        }
        study {
          id
          studyType
          condition
          target {
            id
            approvedSymbol
          }
          biosample {
            biosampleId
            biosampleName
          }
        }
        locus(filter: { variantIds: ["19_44908822_C_T"] }) {
          rows {
            posteriorProbability
          }
        }
        locusSize: locus {
          count
        }
      }
    }
  }
}
