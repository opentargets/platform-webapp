query QTLCredibleSetsQuery {
  variant(variantId: "19_44908822_C_T") {
    variantId
    qtlCredibleSets: credibleSets(
      filter: { studyTypes: [scsqtl, sceqtl, scpqtl, sctuqtl, sqtl, eqtl, pqtl, tuqtl] }
    ) {
      count
      rows {
        credibleSetId
        leadPValueMantissa
        leadPValueExponent
        leadBeta
        fineMappingMethod
        confidence
        leadVariant {
          variantId
          chromosome
        }
        study {
          id
          studyType
          condition
          target {
            id
            approvedSymbol
          }
          biosample {
            biosampleId
            biosampleName
          }
        }
        locus(filter: { variantIds: ["19_44908822_C_T"] }) {
          rows {
            posteriorProbability
          }
        }
        locusSize
      }
    }
  }
}
