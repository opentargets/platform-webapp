query QTLCredibleSetsQuery {
	target(ensemblId:"ENSG00000120210") {
		id
		approvedSymbol
		credibleSets(page: { size: 500, index: 0}) {
			count
			rows {
				credibleSetId
				leadPValueMantissa
				leadPValueExponent
				leadBeta
				fineMappingMethod
				confidence
				isTransQtl
				leadVariant {
					variantId
					chromosome
					position
					referenceAllele
					alternateAllele
				}
				study {
					id
					studyType
					condition
					biosample {
						biosampleId
						biosampleName
					}
				}
				locusSize
			}
		}
	}
}