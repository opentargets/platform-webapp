query GWASColocQuery {
  credibleSet(credibleSetId: "062bf4308e4cbbcac87bde4ee0b58df0") {
    colocalisation(filter: { studyTypes: [gwas] }) {
      count
      rows {
        otherCredibleSet {
          credibleSetId
          study {
            id
            projectId
            traitFromSource
            publicationFirstAuthor
          }
          leadVariant {
            variantId
            chromosome
            position
            referenceAllele
            alternateAllele
          }
          leadPValueMantissa
          leadPValueExponent
        }
        numberColocalisingVariants
        colocalisationMethod
        h3
        h4
        clpp
        betaRatioSignAverage
      }
    }
  }
}
