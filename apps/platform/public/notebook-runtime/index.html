<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Notebook sandbox. Loaded in an iframe with sandbox="allow-scripts" (no
      allow-same-origin), so its origin is opaque. The CSP below blocks every
      network request from user code; 'unsafe-eval' is needed because the
      runtime compiles user code with `new Function` and only applies here.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notebook output</title>
    <style>
      html, body { margin: 0; padding: 0; background: #fff; }
      body { font: 12px "Inter", sans-serif; color: #5a5f5f; overflow: hidden; }
      #output { padding: 8px; box-sizing: border-box; }
      #output > svg, #output > figure { max-width: 100%; }
      #output figure { margin: 0; }
      .nb-empty { color: #9e9e9e; font-style: italic; margin: 0; }
      table { border-collapse: collapse; font-size: 12px; }
      th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid #eee; }
    </style>
  </head>
  <body>
    <div id="output"></div>
    <script src="runtime.js"></script>
  </body>
</html>
